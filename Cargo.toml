[package]
name = "minecraft-pinger"
version = "0.1.0"
edition = "2024"

[features]
default = ["java", "bedrock"]

bedrock = []
java = []

[dependencies]
tokio = { version = "1.*", features = ["full"] }
serde = { version = "1.0.*", features = ["derive"] }
hickory-resolver = { version = "0.26.*", features = ["tokio"] }

serde_json = "1.*"
thiserror = "2.*"

bytes = "1.*"

csv = "1.4.*"
log = "0.4.*"
rand = "0.10.*"
